[project]
name = "scape2009-wiki-api"
version = "0.0.0"
description = "Derived-data pipeline turning 2009scape game sources into a queryable knowledge base, exposed over HTTP-JSON and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arsalan Anwari", email = "arsalan@anwari.nl" }]
keywords = ["2009scape", "runescape", "wiki", "fastapi", "mcp", "knowledge-graph"]
dependencies = [
    "fastapi>=0.140.0",
    "fastmcp>=3.4.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
    "huggingface-hub>=1.24.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
pipeline = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
]
demos = [
    "claude-agent-sdk>=0.2.128",
    "python-dotenv>=1.2.2",
    "pydantic-ai-slim[anthropic,mcp]>=2.22.0",
]

[project.scripts]
scape2009-wiki-mcp = "wiki_api.surfaces.mcp.server:main"
scape2009-wiki-serve = "wiki_api.serve:main"
scape2009-wiki-keys = "wiki_api.access.cli:main"

[project.urls]
Repository = "https://github.com/arsalan-anwari/2009scape-wiki-api"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "poethepoet>=0.48.0",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wiki_api"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "demos", "tools"]
extend-exclude = ["game_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "demos", "tools", "conftest.py"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pyright]
extraPaths = ["demos"]

[tool.pytest.ini_options]
testpaths = ["src", "tests", "tools"]
pythonpath = ["."]
python_files = ["*.py"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib --cov=wiki_api --cov-report=term-missing"

[tool.coverage.run]
source = ["src/wiki_api"]
branch = true

[tool.coverage.report]
exclude_also = ["def test_.*", "if __name__ == .__main__.:"]

[tool.importlinter]
root_packages = ["wiki_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: surfaces > core > repository > domain"
type = "layers"
layers = [
    "wiki_api.surfaces",
    "wiki_api.core",
    "wiki_api.repository",
    "wiki_api.domain",
]

[[tool.importlinter.contracts]]
name = "Runtime never imports the offline pipeline"
type = "forbidden"
source_modules = [
    "wiki_api.surfaces",
    "wiki_api.core",
    "wiki_api.repository",
    "wiki_api.domain",
]
forbidden_modules = ["wiki_api.pipeline"]

[[tool.importlinter.contracts]]
name = "Storage stays invisible above the repository"
type = "forbidden"
source_modules = ["wiki_api.core", "wiki_api.surfaces"]
forbidden_modules = [
    "wiki_api.repository.sqlite",
    "wiki_api.repository.memory",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Access is a leaf: it knows nothing about the game or how it is served"
type = "forbidden"
source_modules = ["wiki_api.access"]
forbidden_modules = [
    "wiki_api.surfaces",
    "wiki_api.core",
    "wiki_api.repository",
    "wiki_api.domain",
    "wiki_api.pipeline",
    "wiki_api.config",
]

[[tool.importlinter.contracts]]
name = "Nothing that serves requests can mint a key"
type = "forbidden"
source_modules = [
    "wiki_api.surfaces",
    "wiki_api.core",
    "wiki_api.repository",
    "wiki_api.domain",
]
forbidden_modules = ["wiki_api.access.issuing", "wiki_api.access.cli"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no transport, storage, or ingestion libraries"
type = "forbidden"
source_modules = ["wiki_api.domain"]
forbidden_modules = [
    "fastapi",
    "fastmcp",
    "starlette",
    "sqlite3",
    "httpx",
    "httpx2",
    "lxml",
]

[tool.poe.tasks]
lint = "ruff check ."
lint-fix = "ruff check --fix ."
format-check = "ruff format --check ."
format = "ruff format ."
typecheck = "mypy"
imports = "lint-imports"
test = "pytest"
check-docs = "bash scripts/check_docs.sh"
container = "bash scripts/container.sh"
build-artifacts = "bash scripts/build_artifacts.sh"
sync-submodules = "bash scripts/sync_submodules.sh"
upload-data = "bash scripts/upload_data.sh"
download-data = "bash scripts/download_data.sh"
fetch-ge = { script = "wiki_api.pipeline.staging.prices:main" }
stage-sources = { script = "wiki_api.pipeline.staging.cli:main" }
allocate-ids = { script = "wiki_api.pipeline.allocate:main" }
build-artifact = { script = "wiki_api.pipeline.artifact.cli:main" }
build-test-artifact = { script = "tests.artifact:main" }
serve = "uvicorn wiki_api.surfaces.http.app:create_app --factory --reload"
mcp = { script = "wiki_api.surfaces.mcp.server:main" }
serve-all = { script = "wiki_api.serve:main" }
keys = { script = "wiki_api.access.cli:main" }
demo = "python demos/run_demo.py"
fix = ["lint-fix", "format"]
check = ["lint", "format-check", "typecheck", "imports", "test"]
